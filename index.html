<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅伴手冊管理中心｜Travel Project Hub</title>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 32px 16px; }
    .container { max-width: 1080px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
    
    .btn-create {
      background: var(--primary); color: #fff; border: none; padding: 10px 18px;
      border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-create:hover { background: var(--primary-dark); }

    .section-title {
      font-size: 1.15rem; font-weight: 600; margin: 28px 0 16px; display: flex;
      align-items: center; gap: 8px; color: #334155;
    }
    .section-title span.count {
      font-size: 0.8rem; background: #e2e8f0; color: #475569;
      padding: 2px 8px; border-radius: 999px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

    .trip-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex;
      flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;
    }
    .trip-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); }
    
    .card-cover {
      height: 130px; background-size: cover; background-position: center;
      position: relative; background-color: #cbd5e1;
    }
    .badge {
      position: absolute; top: 10px; right: 10px; font-size: 0.75rem;
      padding: 4px 8px; border-radius: 6px; font-weight: 600; background: rgba(0,0,0,0.6); color: #fff;
    }
    .badge.completed { background: rgba(100, 116, 139, 0.85); }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; color: #0f172a; }
    .card-date { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }

    .card-actions { margin-top: auto; display: flex; gap: 8px; }
    .card-actions a, .card-actions button {
      flex: 1; text-align: center; text-decoration: none; padding: 8px 12px;
      font-size: 0.85rem; border-radius: 6px; font-weight: 500; cursor: pointer; border: none;
    }
    .btn-view { background: #eff6ff; color: var(--primary); font-weight: 600; }
    .btn-view:hover { background: #dbeafe; }
    .btn-del { background: #fff1f2; color: #e11d48; flex: 0 0 36px; }

    /* Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: #fff; width: 90%; max-width: 440px; border-radius: 16px;
      padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    .modal h2 { font-size: 1.25rem; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.95rem;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .btn-cancel { background: #f1f5f9; color: var(--muted); padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>✈️ 旅伴手冊管理中心</h1>
    <button class="btn-create" onclick="openModal()">＋ 開啟新旅程</button>
  </header>

  <!-- 進行 / 籌備中專案 -->
  <div class="section-title">
    🧳 籌備與進行中專案
    <span class="count" id="active-count">0</span>
  </div>
  <div class="grid" id="active-grid"></div>

  <!-- 過往已完成專案 -->
  <div class="section-title">
    📜 典藏回憶｜已完成專案
    <span class="count" id="completed-count">0</span>
  </div>
  <div class="grid" id="completed-grid"></div>
</div>

<!-- 新增專案彈窗 -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2>開啟新旅程專案</h2>
    <div class="form-group">
      <label>專案名稱</label>
      <input type="text" id="trip-title" placeholder="例如：2027 沖繩自駕小旅行" required>
    </div>
    <div class="form-group">
      <label>出發日期</label>
      <input type="date" id="start-date" required>
    </div>
    <div class="form-group">
      <label>結束日期</label>
      <input type="date" id="end-date" required>
    </div>
    <div class="form-group">
      <label>封面圖片網址 (選填)</label>
      <input type="url" id="cover-url" placeholder="https://images.unsplash.com/...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-create" onclick="saveProject()">建立並前往手冊</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'travel_projects_list';
  const TODAY = new Date().toISOString().split('T')[0];

  // 預設示範行程
  const DEFAULT_PROJECTS = [
    {
      id: 'tokyo-2026',
      title: '東京 5 日風格隨身手冊',
      startDate: '2026-08-15',
      endDate: '2026-08-19',
      cover: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=600&q=80'
    },
    {
      id: 'sapporo-2026',
      title: '北海道秋日散策',
      startDate: '2026-10-08',
      endDate: '2026-10-12',
      cover: 'https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=600&q=80'
    },
    {
      id: 'hcmc-2026',
      title: '胡志明市城市漫遊',
      startDate: '2026-04-30',
      endDate: '2026-05-03',
      cover: 'https://images.unsplash.com/photo-1583417319070-4a69db38a482?auto=format&fit=crop&w=600&q=80'
    }
  ];

  function getProjects() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : DEFAULT_PROJECTS;
  }

  function renderProjects() {
    const list = getProjects();
    const activeGrid = document.getElementById('active-grid');
    const completedGrid = document.getElementById('completed-grid');

    activeGrid.innerHTML = '';
    completedGrid.innerHTML = '';

    let activeCount = 0;
    let completedCount = 0;

    list.forEach(project => {
      const isCompleted = project.endDate < TODAY;
      const card = createCard(project, isCompleted);

      if (isCompleted) {
        completedGrid.appendChild(card);
        completedCount++;
      } else {
        activeGrid.appendChild(card);
        activeCount++;
      }
    });

    document.getElementById('active-count').textContent = activeCount;
    document.getElementById('completed-count').textContent = completedCount;
  }

  function createCard(p, isCompleted) {
    const div = document.createElement('div');
    div.className = 'trip-card';
    const coverUrl = p.cover || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80';
    const statusText = isCompleted ? '已完結' : '籌備中';
    const statusClass = isCompleted ? 'badge completed' : 'badge';

    div.innerHTML = `
      <div class="card-cover" style="background-image: url('${coverUrl}')">
        <span class="${statusClass}">${statusText}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-date">📅 ${p.startDate} ~ ${p.endDate}</div>
        <div class="card-actions">
          <a class="btn-view" href="AyselchangTravel.html?id=${encodeURIComponent(p.id)}">
            ${isCompleted ? '📖 翻閱手冊' : '✏️ 編輯行程'}
          </a>
          <button class="btn-del" onclick="deleteProject('${p.id}')" title="刪除">✕</button>
        </div>
      </div>
    `;
    return div;
  }

  function openModal() { document.getElementById('modal').style.display = 'flex'; }
  function closeModal() { document.getElementById('modal').style.display = 'none'; }

  function saveProject() {
    const title = document.getElementById('trip-title').value.trim();
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const cover = document.getElementById('cover-url').value.trim();

    if (!title || !startDate || !endDate) {
      alert('請填寫完整旅程資訊！');
      return;
    }

    const newTrip = {
      id: 'trip_' + Date.now(),
      title,
      startDate,
      endDate,
      cover
    };

    const list = getProjects();
    list.unshift(newTrip);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));

    // 跳轉至手冊進行編輯
    window.location.href = `AyselchangTravel.html?id=${encodeURIComponent(newTrip.id)}`;
  }

  function deleteProject(id) {
    if (!confirm('確定要移除此旅程專案嗎？')) return;
    const list = getProjects().filter(p => p.id !== id);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    renderProjects();
  }

  renderProjects();
</script>
</body>
</html>
